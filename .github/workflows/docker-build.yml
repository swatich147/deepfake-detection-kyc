name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health/ && curl -sf http://localhost:8080/health && exit 0
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Stop stack
        if: always()
        run: docker compose down -v
