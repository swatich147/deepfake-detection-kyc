# Zero-cost demo stack — run ONLY via Docker (no local Python/Node required)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dfkyc-backend
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.demo
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-demo-secret-key-change-me}
      - AI_SERVICE_URL=http://ai_service:8080
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/src/media
      - backend_db:/app/src/db
    depends_on:
      ai_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    command: >
      sh -c "set -e &&
             mkdir -p /app/src/db /app/src/media &&
             echo 'Running migrations...' &&
             python manage.py migrate --noinput &&
             echo 'Creating demo user...' &&
             python manage.py setup_demo --noinput &&
             echo 'Starting Daphne...' &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: dfkyc-ai
    restart: unless-stopped
    environment:
      - DEVICE=cpu
      - MODEL_DIR=/app/weights
      - MOCK_INFERENCE=${MOCK_INFERENCE:-true}
    ports:
      - "8080:8080"
    volumes:
      - backend_media:/app/src/media:ro
      - ai_weights:/app/weights
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: dfkyc-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_media:
  backend_db:
  ai_weights:

networks:
  default:
    name: dfkyc-network
